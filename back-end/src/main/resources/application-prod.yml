spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contadash}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

api:
  security:
    token:
      # Obrigatório em produção: a aplicação falha no startup se não estiver definida.
      secret: ${API_SECURITY_TOKEN_SECRET}
      expiration: ${API_SECURITY_TOKEN_EXPIRATION:7200000}
