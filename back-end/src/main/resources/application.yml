spring:
  application:
    name: back-end

  # Carrega o .env da raiz quando existir, sem exigir profile específico.
  # A sintaxe [.properties] faz o Spring interpretar o arquivo como chave=valor.
  # Em produção, sem .env, a importação é ignorada e valem as variáveis de ambiente.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    public-documents-dir: ${PUBLIC_DOCUMENTS_DIR:./storage/public-requests}
    public-upload-max-bytes: ${PUBLIC_UPLOAD_MAX_BYTES:26214400}
  deadlines:
    # Gera prazos para documentos antigos que já tinham vencimento.
    backfill-enabled: ${DEADLINES_BACKFILL_ENABLED:true}

api:
  security:
    token:

      secret: ${API_SECURITY_TOKEN_SECRET}
      expiration: ${API_SECURITY_TOKEN_EXPIRATION:7200000}
