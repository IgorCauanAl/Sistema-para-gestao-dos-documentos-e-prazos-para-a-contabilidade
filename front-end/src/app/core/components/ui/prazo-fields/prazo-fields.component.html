
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-semibold mb-1.5 text-slate-700">
          Data de vencimento
          @if (vencimentoObrigatorio) {
            <span class="text-red-500">*</span>
          } @else {
            <span class="font-normal text-slate-400">(opcional)</span>
          }
        </label>
        <input
          type="date"
          class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm text-slate-700 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed"
          [value]="vencimento"
          (input)="onVencimentoChange.emit($any($event.target).value)"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1.5 text-slate-700">Avisar com antecedência</label>
        <select
          class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm text-slate-700 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed"
          [value]="diasAntecedencia"
          [disabled]="!vencimento"
          (change)="onDiasAntecedenciaChange.emit(+$any($event.target).value)"
        >
          @for (dias of opcoes; track dias) {
            <option [value]="dias">{{ dias }} {{ dias === 1 ? 'dia' : 'dias' }} antes</option>
          }
        </select>
        <p class="mt-1.5 text-xs text-slate-400">
          {{
            vencimento
              ? 'Aviso gerado quando faltar esse prazo para o vencimento.'
              : 'Informe a data de vencimento para definir o aviso.'
          }}
        </p>
      </div>
    </div>
