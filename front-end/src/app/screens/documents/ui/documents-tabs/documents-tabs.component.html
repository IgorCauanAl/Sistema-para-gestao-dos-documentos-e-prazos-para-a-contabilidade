
    <div class="flex flex-wrap p-1.5 bg-slate-100 rounded-full gap-1 w-fit" role="tablist">
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="active === tab.id"
          (click)="onChange.emit(tab.id)"
          class="px-5 py-2.5 rounded-full text-sm font-medium transition-all flex items-center gap-2"
          [class]="
            active === tab.id
              ? 'bg-slate-800 text-white shadow-sm'
              : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
          "
        >
          {{ tab.label }}
          <span
            class="text-xs font-semibold px-1.5 py-0.5 rounded-full"
            [class]="active === tab.id ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-600'"
          >
            {{ counts[tab.id] ?? 0 }}
          </span>
        </button>
      }
    </div>
