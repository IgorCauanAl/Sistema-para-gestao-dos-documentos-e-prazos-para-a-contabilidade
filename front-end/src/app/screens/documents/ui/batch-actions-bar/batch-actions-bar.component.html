
    <div
      role="toolbar"
      aria-label="Ações em lote"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-slate-800 text-white rounded-2xl shadow-2xl border border-slate-700 px-5 py-3 flex flex-wrap items-center justify-center gap-3 animate-in fade-in slide-in-from-bottom-2 duration-200"
    >
      <span class="text-sm font-semibold text-slate-200 pr-1">
        {{ count }} documento{{ count > 1 ? 's' : '' }} selecionado{{ count > 1 ? 's' : '' }}
      </span>

      <button
        type="button"
        [disabled]="!podeReenviar"
        (click)="onReenviar.emit()"
        [title]="podeReenviar ? 'Reenviar documentos enviados/visualizados' : 'Selecione documentos Enviados ou Visualizados'"
        class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-indigo-500 hover:bg-indigo-400 disabled:bg-slate-600 disabled:text-slate-400 disabled:cursor-not-allowed text-sm font-semibold transition-colors"
      >
        <svg lucideRotateCcw [size]="15"></svg> Reenviar
      </button>

      <button
        type="button"
        (click)="onExportar.emit()"
        class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-slate-700 hover:bg-slate-600 text-sm font-semibold transition-colors"
      >
        <svg lucideFileDown [size]="15"></svg> Exportar protocolos (CSV)
      </button>

      <button
        type="button"
        [disabled]="!podeJuntar"
        (click)="onJuntar.emit()"
        [title]="motivoJuntar ?? 'Juntar os PDFs selecionados em um único arquivo'"
        class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-600 disabled:text-slate-400 disabled:cursor-not-allowed text-sm font-semibold transition-colors"
      >
        <svg lucideCombine [size]="15"></svg> Juntar em um PDF
      </button>

      <button
        type="button"
        (click)="onClear.emit()"
        aria-label="Limpar seleção"
        title="Limpar seleção"
        class="p-2 rounded-full text-slate-300 hover:bg-slate-700 transition-colors"
      >
        <svg lucideX [size]="16"></svg>
      </button>
    </div>
