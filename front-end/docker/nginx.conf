server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limite ligeiramente acima do max-request-size do back-end (26 MB).
    client_max_body_size 30M;

    # O Angular chama a API por URLs relativas (/auth, /customers, ...).
    # O nginx as encaminha para o contêiner do back-end, mantendo a origem única.
    location ~ ^/(auth|customers|dashboard|documents|deadlines?|requests|public)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Rotas do Angular (ex.: /login, /clientes/3, /s/:token) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
